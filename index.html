<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShieldSync</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #03070f; color: #e2e8f0; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .card { text-align: center; padding: 40px; }
      .logo { font-size: 48px; margin-bottom: 16px; }
      h1 { font-size: 32px; font-weight: 900; color: #0ea5e9; }
      p { color: #475569; margin-top: 8px; font-size: 16px; }
      .badge { display: inline-block; margin-top: 20px; padding: 8px 20px; background: #0ea5e910; border: 1px solid #0ea5e940; border-radius: 8px; color: #0ea5e9; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🛡️</div>
      <h1>ShieldSync</h1>
      <p>Security Management Platform</p>
      <div class="badge">✓ System Online — Sanford, FL</div>
    </div>
  </body>
</html>
