name: Backend Deploy

# No production AWS account exists for this backend yet, so the deploy step below has
# never actually run against a real ECS service — see docs/ember/DEPLOYMENT_READINESS_CHECKLIST.md.
# What IS real: this workflow builds the image, pushes it to GitHub Container Registry
# (needs only the repo's own built-in GITHUB_TOKEN — no external secrets to fake), runs
# migrations against whatever DATABASE_URL the deploy environment provides, and — once the
# `AWS_DEPLOY_ROLE_ARN` secret plus the `ECS_CLUSTER_NAME`/`ECS_SERVICE_NAME`/`API_URL`
# repository variables are set (which infra/terraform's `modules/ecs` outputs feed
# directly) — deploys for real via `aws ecs update-service` and validates `/ready` before
# declaring success. No further edits to this file are needed once those five values exist
# (per docs/ember/DEPLOYMENT_READINESS_CHECKLIST.md's CI/CD row and the user's requirement
# that supplying configuration is the only remaining step). Until then, the last step says
# so explicitly instead of silently no-op'ing.
#
# Manual rollback: re-run this workflow via workflow_dispatch with `image_tag` set to any
# previously built tag (every push to main produces one, tagged by commit SHA — see
# `docker/metadata-action` below) — that re-runs the migrate+deploy steps against the
# already-built older image instead of building a new one. See docs/ember/RELEASE.md for
# the full rollback runbook, including what to do if a migration itself needs reverting
# (not always safe to just redeploy an old image — schema changes can be forward-only).

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to redeploy (rollback), e.g. a commit SHA. Leave blank to build+deploy the current branch head."
        required: false
        type: string

defaults:
  run:
    working-directory: backend

permissions:
  contents: read
  packages: write
  id-token: write # required for OIDC federation to AWS — no long-lived AWS access keys stored as GitHub secrets

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ember-backend

jobs:
  build-and-push:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-and-deploy:
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || inputs.image_tag != '')
    runs-on: ubuntu-latest
    environment: production # requires a "production" environment configured with real deployment secrets (DATABASE_URL, etc.) before this job can do anything real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (for the Prisma CLI only — not the runtime image)
        run: npm ci

      - name: Run database migrations
        # migrate deploy (not migrate dev) — never generates new migrations, only applies
        # already-committed ones. Requires DATABASE_URL to be set as a real "production"
        # environment secret in this repo's GitHub environment settings — see
        # docs/ember/DEPLOYMENT.md and SECURITY_NOTES.md/OPEN_DECISIONS.md D-04 for why
        # this should use a migration-scoped DB role, not the runtime app's own role.
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      # Everything below is gated on AWS_DEPLOY_ROLE_ARN existing as a real repository/
      # environment secret — an IAM role ARN, trusted for GitHub OIDC federation, scoped to
      # (at minimum) ecs:UpdateService and ecs:DescribeServices on the cluster/service
      # infra/terraform's modules/ecs creates. Until that secret (and the ECS_CLUSTER_NAME /
      # ECS_SERVICE_NAME / API_URL repository variables it depends on) are set, only the
      # final "not configured yet" step below runs.

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy to ECS
        if: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --force-new-deployment \
            --query 'service.{cluster:clusterArn,service:serviceName,deployments:deployments[].{status:status,taskDefinition:taskDefinition}}'

      - name: Wait for service to stabilize
        if: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_NAME }}"

      - name: Validate health check
        if: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "The API_URL repository variable is not set — cannot validate the deployed service's /ready endpoint." >&2
            exit 1
          fi
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.API_URL }}/ready" || echo "000")
            if [ "$status" = "200" ]; then
              echo "GET /ready returned 200 — deploy verified healthy."
              exit 0
            fi
            echo "Attempt $i: GET /ready returned $status, retrying in 10s..."
            sleep 10
          done
          echo "GET /ready did not return 200 within the retry window — treating this deploy as failed." >&2
          exit 1

      - name: No hosting target configured yet
        if: ${{ secrets.AWS_DEPLOY_ROLE_ARN == '' }}
        run: |
          echo "AWS_DEPLOY_ROLE_ARN is not configured for this repository's production environment yet."
          echo "Image published: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag || inputs.image_tag }}"
          echo ""
          echo "Once infra/terraform has been applied for real (see infra/terraform/README.md)"
          echo "and the following are set, this job deploys for real with no further"
          echo "workflow edits needed:"
          echo "  - secret AWS_DEPLOY_ROLE_ARN   (IAM role ARN, trusted for GitHub OIDC,"
          echo "                                   scoped to ecs:UpdateService/DescribeServices"
          echo "                                   on the cluster/service Terraform creates)"
          echo "  - variable ECS_CLUSTER_NAME    (Terraform output: ecs_cluster_name)"
          echo "  - variable ECS_SERVICE_NAME    (Terraform output: ecs_service_name)"
          echo "  - variable API_URL             (Terraform output: api_url, or the ALB DNS name)"
          echo "  - variable AWS_REGION           (optional, defaults to us-east-1)"
          echo ""
          echo "See docs/ember/OPERATOR_RUNBOOK.md's 'Deploy' section and"
          echo "docs/ember/DEPLOYMENT_READINESS_CHECKLIST.md's CI/CD row."
          exit 0
