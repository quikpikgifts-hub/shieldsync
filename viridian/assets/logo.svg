<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" role="img" aria-label="Viridian Pressure Wash logo">
  <defs>
    <linearGradient id="vGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA7E1"/>
      <stop offset="0.45" stop-color="#0C6B3A"/>
      <stop offset="1" stop-color="#0B5A30"/>
    </linearGradient>
  </defs>
  <!-- V mark: bold checkmark/wave -->
  <g>
    <path d="M18 22 L62 22 L92 96 L120 8 L150 8 L104 132 L70 132 Z"
          fill="url(#vGreen)"/>
    <!-- upward tick accent -->
    <path d="M120 8 L150 8 L130 60 L112 50 Z" fill="#0C6B3A" opacity="0.85"/>
    <!-- water waves -->
    <path d="M14 124 q18 -14 36 0 t36 0 t36 0" fill="none" stroke="#1FA7E1" stroke-width="7" stroke-linecap="round"/>
    <path d="M22 140 q16 -12 32 0 t32 0 t32 0" fill="none" stroke="#1FA7E1" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Wordmark -->
  <text x="176" y="74" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="46" fill="#0C6B3A" letter-spacing="0.5">VIRIDIAN</text>
  <text x="178" y="108" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="29" fill="#0B1F3A" letter-spacing="3">PRESSURE WASH</text>
  <text x="180" y="132" font-family="'Open Sans', Arial, sans-serif" font-weight="600" font-size="13" fill="#1FA7E1" letter-spacing="4.5">CLEAN. PROTECT. IMPRESS.</text>
</svg>
