<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="Montserrat, Arial, sans-serif" role="img" aria-label="Viridian Pressure Wash — front wrap mockup">
  <defs>
    <linearGradient id="fv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA7E1"/><stop offset="0.5" stop-color="#0C6B3A"/><stop offset="1" stop-color="#0B5A30"/>
    </linearGradient>
    <linearGradient id="fwave" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0C6B3A"/><stop offset="1" stop-color="#1FA7E1"/></linearGradient>
    <clipPath id="fbody"><path d="M110 150 C110 120 150 104 210 102 L350 102 C410 104 450 120 450 150 L460 430 C460 466 438 484 404 484 L156 484 C122 484 100 466 100 430 Z"/></clipPath>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="800" fill="#0B1F3A">FRONT VIEW</text>
  <rect x="38" y="52" width="120" height="4" fill="#0C6B3A"/>
  <ellipse cx="280" cy="520" rx="210" ry="22" fill="#0B1F3A" opacity="0.08"/>

  <path d="M110 150 C110 120 150 104 210 102 L350 102 C410 104 450 120 450 150 L460 430 C460 466 438 484 404 484 L156 484 C122 484 100 466 100 430 Z"
        fill="#dfe8f0" stroke="#0B1F3A" stroke-width="3"/>
  <g clip-path="url(#fbody)">
    <rect x="95" y="300" width="370" height="200" fill="#0B1F3A"/>
    <path d="M95 340 C200 312 360 360 470 322 L470 500 L95 500 Z" fill="url(#fwave)" opacity="0.95"/>
  </g>

  <!-- windshield -->
  <path d="M150 150 C160 124 200 112 280 112 C360 112 400 124 410 150 L410 250 L150 250 Z" fill="#1a2c45" stroke="#0B1F3A" stroke-width="2"/>
  <!-- hood line -->
  <line x1="120" y1="300" x2="440" y2="300" stroke="#9fb1c4" stroke-width="2" opacity="0.5"/>
  <!-- headlights -->
  <path d="M104 300 q-6 24 8 50 l52 -8 -10 -46 Z" fill="#cfe0ee"/>
  <path d="M456 300 q6 24 -8 50 l-52 -8 10 -46 Z" fill="#cfe0ee"/>
  <!-- grille -->
  <rect x="210" y="430" width="140" height="40" rx="10" fill="#0a1726"/>
  <!-- bumper -->
  <rect x="120" y="470" width="320" height="20" rx="8" fill="#0a1726"/>

  <!-- V mark on hood -->
  <g transform="translate(232,300)">
    <path d="M0 6 L30 6 L50 60 L68 4 L94 4 L66 84 L42 84 Z" fill="url(#fv)"/>
    <path d="M10 84 q16 -11 32 0 t32 0" fill="none" stroke="#1FA7E1" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- small wordmark -->
  <text x="280" y="412" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">VIRIDIAN</text>
  <text x="280" y="430" font-size="11" font-weight="800" fill="#1FA7E1" text-anchor="middle" letter-spacing="3">PRESSURE WASH</text>
</svg>
