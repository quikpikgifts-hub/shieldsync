<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="Montserrat, Arial, sans-serif" role="img" aria-label="Viridian Pressure Wash — rear wrap mockup">
  <defs>
    <linearGradient id="rwave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0C6B3A"/><stop offset="1" stop-color="#1FA7E1"/>
    </linearGradient>
    <linearGradient id="rv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA7E1"/><stop offset="0.5" stop-color="#0C6B3A"/><stop offset="1" stop-color="#0B5A30"/>
    </linearGradient>
    <clipPath id="rbody"><path d="M120 120 C120 96 150 84 200 82 L360 82 C410 84 440 96 440 120 L452 470 C452 506 430 524 396 524 L164 524 C130 524 108 506 108 470 Z"/></clipPath>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="800" fill="#0B1F3A">REAR VIEW</text>
  <rect x="38" y="52" width="120" height="4" fill="#0C6B3A"/>
  <ellipse cx="280" cy="560" rx="210" ry="22" fill="#0B1F3A" opacity="0.08"/>

  <!-- rear body -->
  <path d="M120 120 C120 96 150 84 200 82 L360 82 C410 84 440 96 440 120 L452 470 C452 506 430 524 396 524 L164 524 C130 524 108 506 108 470 Z"
        fill="#dfe8f0" stroke="#0B1F3A" stroke-width="3"/>
  <g clip-path="url(#rbody)">
    <rect x="100" y="250" width="360" height="280" fill="#0B1F3A"/>
    <path d="M100 300 C200 270 360 320 470 280 L470 530 L100 530 Z" fill="url(#rwave)" opacity="0.95"/>
    <path d="M100 330 C220 300 360 350 470 315 L470 530 L100 530 Z" fill="#0B1F3A" opacity="0.35"/>
  </g>

  <!-- rear glass -->
  <rect x="150" y="110" width="260" height="120" rx="10" fill="#1a2c45" stroke="#0B1F3A" stroke-width="2"/>
  <!-- tail lights -->
  <path d="M108 250 q-10 30 6 70 l40 -6 -8 -70 Z" fill="#b8202a"/>
  <path d="M452 250 q10 30 -6 70 l-40 -6 8 -70 Z" fill="#b8202a"/>
  <!-- bumper -->
  <rect x="120" y="480" width="320" height="44" rx="10" fill="#0a1726"/>

  <!-- V mark -->
  <g transform="translate(228,242)">
    <path d="M0 6 L34 6 L56 70 L78 4 L106 4 L74 96 L46 96 Z" fill="url(#rv)"/>
    <path d="M12 96 q18 -13 36 0 t36 0" fill="none" stroke="#1FA7E1" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="372" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">VIRIDIAN</text>
  <text x="280" y="398" font-size="18" font-weight="800" fill="#1FA7E1" text-anchor="middle" letter-spacing="4">PRESSURE WASH</text>

  <!-- phone + website (read in traffic) -->
  <text x="280" y="446" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">407-555-0123</text>
  <text x="280" y="472" font-size="18" font-weight="700" fill="#9fe0ff" text-anchor="middle">ViridianWash.com</text>

  <!-- QR -->
  <g transform="translate(372,250)">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#ffffff" stroke="#0B1F3A" stroke-width="2"/>
    <g fill="#0B1F3A"><rect x="8" y="8" width="18" height="18"/><rect x="44" y="8" width="18" height="18"/><rect x="8" y="44" width="18" height="18"/><rect x="32" y="32" width="7" height="7"/><rect x="44" y="44" width="7" height="7"/><rect x="54" y="54" width="8" height="8"/></g>
  </g>
  <!-- social -->
  <g transform="translate(120,254)" font-size="12" font-weight="800">
    <circle cx="13" cy="13" r="13" fill="#1FA7E1"/><text x="13" y="18" fill="#fff" text-anchor="middle">f</text>
    <rect x="0" y="32" width="26" height="26" rx="7" fill="#0C6B3A"/><text x="13" y="50" fill="#fff" text-anchor="middle">◉</text>
  </g>
</svg>
