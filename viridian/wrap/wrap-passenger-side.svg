  <!-- Big V mark on rear quarter (left side now) -->
  <g transform="translate(150,250)">
    <path d="M0 8 L42 8 L70 86 L96 4 L132 4 L92 120 L58 120 Z" fill="url(#vmark2)"/>
    <path d="M14 120 q22 -16 44 0 t44 0" fill="none" stroke="#1FA7E1" stroke-width="7" stroke-linecap="round"/>
