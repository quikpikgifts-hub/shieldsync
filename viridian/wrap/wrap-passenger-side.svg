    <path d="M40 250 C160 290 340 270 520 320 C770 380 980 290 1200 330 L1200 410 L40 410 Z" fill="#0B1F3A" opacity="0.35"/>
    <g fill="#9fe0ff" opacity="0.8"><circle cx="250" cy="262" r="4"/><circle cx="220" cy="250" r="2.5"/><circle cx="980" cy="300" r="4"/><circle cx="1010" cy="288" r="2.5"/></g>
  </g>

  <!-- windows -->
  <g fill="#1a2c45" stroke="#0B1F3A" stroke-width="2">
