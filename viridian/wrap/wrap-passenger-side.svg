    <g fill="#0B1F3A"><rect x="10" y="10" width="22" height="22"/><rect x="54" y="10" width="22" height="22"/><rect x="10" y="54" width="22" height="22"/><rect x="40" y="40" width="8" height="8"/><rect x="52" y="52" width="8" height="8"/><rect x="64" y="64" width="10" height="10"/></g>
    <text x="43" y="104" font-size="11" font-weight="700" fill="#0B1F3A" text-anchor="middle">SCAN TO QUOTE</text>
