  <ellipse cx="620" cy="470" rx="540" ry="26" fill="#0B1F3A" opacity="0.08"/>

  <!-- body (front to the right) -->
  <path d="M60 360 C60 300 110 250 200 232 C260 150 370 106 530 106 L910 106 C970 108 1018 120 1048 150 L1138 232 C1228 250 1180 300 1180 350 L1180 372 C1180 384 1172 392 1160 392 L92 392 C80 392 60 382 60 372 Z"
