      <stop offset="0" stop-color="#1FA7E1"/><stop offset="0.45" stop-color="#118a4a"/><stop offset="1" stop-color="#0C6B3A"/>
    </linearGradient>
    <linearGradient id="vmark2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA7E1"/><stop offset="0.5" stop-color="#0C6B3A"/><stop offset="1" stop-color="#0B5A30"/>
    </linearGradient>
    <clipPath id="body2"><path d="M60 360 C60 300 110 250 200 232 C260 150 370 106 530 106 L910 106 C970 108 1018 120 1048 150 L1138 232 C1228 250 1180 300 1180 350 L1180 372 C1180 384 1172 392 1160 392 L92 392 C80 392 60 382 60 372 Z"/></clipPath>
