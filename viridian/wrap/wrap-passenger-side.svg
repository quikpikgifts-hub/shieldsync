    <rect x="554" y="126" width="150" height="100" rx="6"/>
    <rect x="418" y="126" width="120" height="100" rx="6"/>
    <path d="M210 226 C260 168 320 134 402 126 L402 226 Z"/>
  </g>
  <g stroke="#cdd8e3" stroke-width="3" opacity="0.5"><line x1="712" y1="126" x2="712" y2="226"/><line x1="546" y1="126" x2="546" y2="226"/></g>
  <g stroke="#9fb1c4" stroke-width="3" fill="none" opacity="0.6"><line x1="770" y1="300" x2="820" y2="300"/><line x1="430" y1="300" x2="480" y2="300"/></g>

  <!-- wheels -->
  <g>
    <circle cx="950" cy="392" r="62" fill="#11151c"/><circle cx="950" cy="392" r="30" fill="#c9d2db"/><circle cx="950" cy="392" r="9" fill="#6b7886"/>
    <circle cx="290" cy="392" r="62" fill="#11151c"/><circle cx="290" cy="392" r="30" fill="#c9d2db"/><circle cx="290" cy="392" r="9" fill="#6b7886"/>
