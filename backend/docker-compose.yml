services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember_dev_password
      POSTGRES_DB: ember_dev
    ports:
      - "5432:5432"
    volumes:
      - ember_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: "postgresql://ember:ember_dev_password@postgres:5432/ember_dev?schema=public"
      # Never bake a real secret into an image or compose file for anything beyond local
      # dev — see .env.example and DEPLOYMENT.md for how this is supplied in real
      # environments (a secrets manager, not a committed value).
      JWT_ACCESS_SECRET: "compose-local-dev-secret-change-me-0000000000"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL_DAYS: "30"
      CORS_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "3001:3001"

volumes:
  ember_postgres_data:
